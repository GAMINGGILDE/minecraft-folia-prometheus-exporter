http:
  bind-address: "127.0.0.1"
  port: 9940
  metrics-path: "/metrics"
  health-path: "/health"
  ready-path: "/ready"
  worker-threads: 2

collection:
  server-interval: "5s"
  world-interval: "10s"
  folia-interval: "5s"
  filesystem-interval: "30m"
  timeout: "10s"
  filesystem-timeout: "15m"

collectors:
  server: true
  events: true
  worlds: true
  chunks: true
  entities: true
  folia: true
  jvm: true
  process: true
  filesystem: true
  plugin-info: false

entities:
  reconciliation-interval: "5m"
  reconciliation-timeout: "60s"
  include-exact-types: false
  include-projectile-total: false

folia:
  observation-sources:
    player-regions: true
    world-spawns: true
    force-loaded-chunks: false
    configured-locations: []

  observation-ttl: "60s"
  tps-windows:
    - "5s"
    - "15s"
    - "1m"
    - "5m"
    - "15m"
  tps-statistics:
    - "min"
    - "p05"
    - "p50"
    - "p95"
    - "max"
    - "average"
  tps-thresholds:
    - 19.0
    - 18.0
    - 15.0

filesystem:
  include-world-sizes: true
  world-size-scan-concurrency: 1

privacy:
  individual-player-metrics-supported: false

logging:
  collection-errors: true
